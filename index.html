<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>LifeHub · 我的学习生活管理</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════ 顶部栏 ══════════ -->
<header class="topbar" id="topbar">
  <div class="topbar-left">
    <h1 class="page-title" id="pageTitle">今日</h1>
    <span class="page-sub" id="pageSub"></span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="btnHelp" title="操作手册" aria-label="操作手册">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="btnAi" title="AI 助手" aria-label="AI 助手">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15z"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H10a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V10a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </div>
</header>

<!-- ══════════ 主视图区 ══════════ -->
<main class="viewport" id="viewport">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-import"></section>
  <section class="view" id="view-body"></section>
  <section class="view" id="view-money"></section>
  <section class="view" id="view-history"></section>
  <section class="view" id="view-learn"></section>
  <section class="view" id="view-help"></section>
</main>

<!-- ══════════ 底部导航 ══════════ -->
<nav class="tabbar" id="tabbar">
  <button class="tab" data-view="today" aria-label="今日">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h12a1 1 0 001-1V9.5"/></svg>
    <span>今日</span>
  </button>
  <button class="tab" data-view="plan" aria-label="计划">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/><path d="M7.5 13.5h3M7.5 17h6"/></svg>
    <span>计划</span>
  </button>
  <button class="tab tab-center" data-view="import" aria-label="导入">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span>导入</span>
  </button>
  <button class="tab" data-view="body" aria-label="饮食作息">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 3v7a3 3 0 003 3v8M7 3v6M17 3c-1.7 0-3 2-3 4.5S15.3 12 17 12v9"/></svg>
    <span>饮食</span>
  </button>
  <button class="tab" data-view="history" aria-label="回顾">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6"/><path d="M3 4v5h5"/><path d="M12 8v4.5l3 1.8"/></svg>
    <span>回顾</span>
  </button>
  <button class="tab" data-view="money" aria-label="账本">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5A2.5 2.5 0 015.5 5H17a2 2 0 012 2v1"/><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>
    <span>账本</span>
  </button>
</nav>

<!-- ══════════ 通用浮层 ══════════ -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">标题</h2>
    <button class="icon-btn sm" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/ics.js"></script>
<script src="js/ai.js"></script>
<script src="js/parser.js"></script>
<script src="js/schedule.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/wechat.js"></script>
<script src="js/charts.js"></script>
<script src="js/blueprint.js"></script>
<script src="js/history.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/importv.js"></script>
<script src="js/views/body.js"></script>
<script src="js/views/money.js"></script>
<script src="js/views/history.js"></script>
<script src="js/views/learn.js"></script>
<script src="js/views/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
